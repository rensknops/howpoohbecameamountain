<script>
    
    // Tracks mouse movement and spawns a honey drop every few pixels
    document.addEventListener("mousemove", function(e) {
        // Create a drop element
        const drop = document.createElement("div");
        drop.classList.add("honey-drop");

        // Position the drop right at the cursor coordinates
        drop.style.left = (e.pageX - 7) + "px";
        drop.style.top = (e.pageY - 5) + "px";

        // Add it to the page body
        document.body.appendChild(drop);

        // Remove the element from the DOM after the 0.8s animation finishes to keep memory clean
        setTimeout(function() {
            drop.remove();
        }, 800);
    });

        // Set the date Pooh ate all the honey (Year, Month-1, Day) -> e.g., Jan 1, 2023
    const disasterDate = new Date(2023, 0, 1);
    const today = new Date();

    // Calculate difference in days
    const diffTime = Math.abs(today - disasterDate);
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    // Update the number in the ticker
    document.getElementById("honey-days").textContent = diffDays.toLocaleString();

    </script>
